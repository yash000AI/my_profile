<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #0f172a, #2563eb, #7c3aed);
      color: #fff;
    }

    .hero {
      text-align: center;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(14px);
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      max-width: 620px;
      border: 1px solid rgba(255,255,255,0.25);
    }

    h1 { font-size: 2.2rem; margin-bottom: 10px; }
    p { font-size: 1.05rem; color: #e2e8f0; margin-bottom: 18px; }

    a {
      display: inline-block;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }

    a:hover { transform: translateY(-2px) scale(1.02); }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Welcome to Your Profile Page</h1>
    <p>Enter your details, and your vibrant interactive profile will appear instantly.</p>
    <a href="profile.html">Open Profile Page</a>
  </div>
</body>
</html>
