<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yash Islampure</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 40px 60px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2.2rem;
      color: #1f3c88;
    }

    p {
      margin: 0;
      font-size: 1.2rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Yash Islampure</h1>
    <p>Location: Baramati</p>
  </div>
</body>
</html>
